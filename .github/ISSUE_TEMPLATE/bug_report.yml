name: Bug report
description: Report a broken demo, asset, or repository tool.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page URL, case ID, and method if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser/version, operating system, local preview or hosted URL
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant browser console or validation output. Remove private paths and credentials.
