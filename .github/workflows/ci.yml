name: Code checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install method dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q config.py geometry.py sampler.py execution.py controller.py check.py
      - name: Run CPU sanity check
        env:
          JAX_PLATFORMS: cpu
        run: python check.py
